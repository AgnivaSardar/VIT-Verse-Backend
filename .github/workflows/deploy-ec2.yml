name: Deploy to EC2

on:
  push:
    branches: [ main, EC2-Branch ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/vitverse-backend
          git pull origin ${{ github.ref_name }}
          npm ci
          npm run build
          pm2 restart all
          pm2 save
          echo "✅ AUTO-DEPLOY COMPLETE on ubuntu@18.60.156.89!"
