name: Deploy VITVerse Backend to EC2

on:
  push:
    branches:
      - EC2-Branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.EC2_PATH }}

            git pull origin EC2-Branch
            npm install
            npx prisma generate
            npm run build

            pm2 restart vitverse-backend || pm2 start dist/index.js --name vitverse-backend --env production
            pm2 save
          EOF

